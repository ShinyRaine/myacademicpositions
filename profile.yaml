# ============================================================================
# 候选人画像与打分权重 —— 这是整个系统唯一需要你手动维护的文件
# 改完 push，下一次 scan 就按新规则重新打分（所有在招岗位都会重算，不只是新岗）
# ============================================================================

candidate:
  name: Xinyu Cheng
  # 送给 LLM 研判时用的自我介绍。写实，不要写成求职信。
  summary: |
    MSc student in Complex Adaptive Systems (MPCAS) at Chalmers University of
    Technology, Gothenburg, Sweden (enrolled 2025, graduating 2027). Master's
    thesis in Karinne Ramirez-Amaro's group on neuro-symbolic task and motion
    planning: learning symbolic preconditions/effects of manipulation actions
    from demonstrations, and executing them with dynamical-system (DS) motion
    policies that carry stability and safety guarantees.

    Hands-on experience: Universal Robots UR10e on real hardware (ROS, RTDE,
    gripper + force/torque sensing), Unity/AGX simulation, learning from
    demonstration, Gaussian-mixture DS fitting, obstacle modulation, control
    barrier functions in joint space, admittance control and passivity for
    physical human-robot interaction, execution-time condition monitoring and
    failure recovery.

    Looking for a PhD position (or a research-assistant position leading to
    one) in robot learning, manipulation, task and motion planning, safe or
    verifiable control, or neuro-symbolic AI for robotics. Formally eligible
    for Swedish third-cycle studies (second-cycle degree / 240 hp route).
    Working languages: English (research), Chinese (native). No Swedish.

  # 申请硬约束，LLM 研判时会检查
  constraints:
    earliest_start: "2027-06"       # 毕设结束后才能全职入职
    degree_at_start: "MSc"
    needs_visa_sponsorship: true
    swedish_required_is_blocker: true

# ----------------------------------------------------------------------------
# 0. 岗位来源。顺序即优先级：同一个岗位被多个源收录时，排在后面的那个胜出，
#    因为学校自己的页面带联系人、入职日期和完整正文。
#    Academic Positions 是付费聚合站，覆盖不全——2026-10-30 实测它收了 KTH 全部
#    20 个 PhD/RA 岗，但 Uppsala 只有 1 条、Linköping 1 条、Umeå 0 条，
#    TU Delft / TUM / KIT / Edinburgh / IIT / Idiap 一条都没有。
# ----------------------------------------------------------------------------
sources:
  - ap
  - chalmers
  - kth

# ----------------------------------------------------------------------------
# 1. 硬门槛：不满足直接丢弃，连面板都不进
# ----------------------------------------------------------------------------
hard_filters:
  # 只保留这些岗位类型（按标题 + 正文判定，支持瑞典语/德语/荷兰语标题）
  position_types: [phd, research_assistant]
  # 截止日已过的丢弃；还剩不到这么多天的标记为 urgent 但仍显示
  drop_if_expired: true
  urgent_days: 14

# ----------------------------------------------------------------------------
# 2. 主题匹配 —— 分数的全部来源
#    一条广告的分 = 它的研究内容和你的研究内容重合多少，满分 100。
#    学校、国家、导师名字、经费条件一律不计分（见第 4 节），因为那不是内容。
#
#    关键词一律写单数、不用管连字符：复数自动匹配（robot 命中 "Robots"），
#    连字符和斜杠两边都折成空格（dynamical system 命中 "dynamical-system"）。
#
#    每组的权重要不要吃满，取决于关键词出现在哪儿（见第 8 节 evidence）：
#    标题里 = 广告自己说它是干这个的，全额；只在正文里出现一次，多半是
#    「本系涵盖 XX、YY、机器人学……」这类院系套话，只给一点点。
# ----------------------------------------------------------------------------
topics:
  cap: 100
  groups:
    # ---- 你毕设的正中心 ----
    - weight: 34
      label: core-tamp
      requires: robotics      # 没有机器人语境时只拿 context_floor 那一成
      terms:
        - task and motion planning
        - tamp
        - neuro-symbolic
        - neurosymbolic
        - symbolic planning
        - symbol grounding
        - pddl
        - action model learning
        - precondition
        - skill learning
        - learning from demonstration
        - imitation learning
        - programming by demonstration
        - robot skill

    # ---- DS / 安全控制，毕设的另一半 ----
    - weight: 26
      label: core-safe-control
      requires: robotics      # "dynamical systems" 在纯控制论广告里不是你的课题
      terms:
        - dynamical system
        - motion primitive
        - movement primitive
        - control barrier function
        - safe control
        - safety guarantee
        - formal verification
        - formal methods
        - temporal logic
        - ltl
        - signal temporal logic
        - reactive synthesis
        - correct-by-construction
        - passivity
        - impedance control
        - admittance control
        - compliant control

    # ---- 机器人学一般方向 ----
    - weight: 20
      label: robotics
      terms:
        - robot
        - robotic
        - manipulation
        - manipulator
        - grasping
        - motion planning
        - mobile manipulation
        - embodied
        - human-robot interaction
        - physical human-robot
        - teleoperation
        - autonomous system

    # ---- 真机/仿真的动手经验，你有而多数申请者没有 ----
    - weight: 10
      label: hands-on
      terms:
        - universal robots
        - ur5
        - ur10
        - franka
        - panda arm
        - ros
        - ros2
        - moveit
        - rtde
        - force/torque
        - force-torque
        - gazebo
        - mujoco
        - pybullet
        - isaac sim
        - real robot
        - real-world experiments
        - hardware experiments

    # ---- 邻接：会用到但不是你的定位 ----
    - weight: 10
      label: adjacent-ai
      terms:
        - reinforcement learning
        - machine learning
        - deep learning
        - representation learning
        - foundation model
        - vision-language
        - explainable
        - interpretable
        - trustworthy ai
        - knowledge representation
        - automated planning
        - computer vision
        - sim-to-real
        - digital twin

    # ---- 弱邻接：只够把岗位从 0 分拉起来 ----
    - weight: 4
      label: weak
      terms:
        - control theory
        - optimization
        - optimal control
        - estimation
        - sensor fusion
        - cyber-physical
        - mechatronics
        - automation
        - industrial

# ----------------------------------------------------------------------------
# 3. 排除：命中即扣分。只看标题和摘要——广告在那儿说明自己是干什么的，
