# ----------------------------------------------------------------------------
# 5. 分档：内容匹配分（0-100）-> 档位。只有前两档会开 GitHub Issue、
#    花 Gemini 额度。A/B/C/D 只是内部排序用的键，面板和 Issue 上显示的是 name。
#
#    对着 evidence 表读这几条线：
#    58 = 核心课题写在标题里，或者两个核心组都在摘要里；
#    34 = 广告标题是 robotics，核心课题只在正文里提到；
#    16 = 只有邻接词，或者核心词只在正文里露过一两次。
# ----------------------------------------------------------------------------
tiers:
  A:
    min: 58
    name: 对口            # 广告自己说的研究内容就是你在做的
    github: tier:对口
  B:
    min: 34
    name: 值得细看        # 内容有实质重合，但不是正中心
    github: tier:值得细看
  C:
    min: 16
    name: 擦边            # 面板里可见，不开 issue，不花 LLM
  D:
    min: 0
    name: 不相关          # 默认在面板里折叠

# ----------------------------------------------------------------------------
# 6. LLM 研判
# ----------------------------------------------------------------------------
llm:
  enabled: true
  model: gemini-3.5-flash     # 2-6 s/次；想更准可换 gemini-3.8-flash（50 s-5 min/次）
  max_jobs_per_run: 25        # 单次 scan 最多研判多少个新岗位，防止免费额度被打爆
  min_tier: B                 # 只研判 A/B
  body_chars: 9000            # 送进去的正文截断长度

# ----------------------------------------------------------------------------
# 7. GitHub Issue
# ----------------------------------------------------------------------------
issues:
  max_per_run: 30   # 首次 bootstrap 可能一次命中几十个，分批开，免得刷屏
  # scan 自己开 Issue 的门槛：Gemini 的 fit 要 ≥ 这个数（也就是 >5）。
  # 档位只决定谁值得花钱研判，开不开 Issue 由读完全文的研判说了算——
  # 规则分只认词汇，ETH 那条 spectral submanifold 的降阶建模岗靠
  # "dynamical systems" 拿了 36 分，研判给 2/10。
  # 没有研判的不开（额度用完、调用失败），下次研判回来了再开。
  # 被挡下的岗位在面板上点「开始准备投递」照样能手动开 Issue。
  min_fit: 6


# ----------------------------------------------------------------------------
# 8. 命中位置的折算
#    关键词在哪儿出现，决定这组权重吃到几成。标题 = 广告自己宣称的课题；
#    正文里孤零零一次 = 多半是院系介绍里的套话，别当成课题。
# ----------------------------------------------------------------------------
scoring:
  # 带 requires 的组，在缺少那个语境时还能拿几成权重。
  # 0 = 完全不给（太狠：neuro-symbolic 的 NLP 岗会掉到 0）；
  # 1 = 关掉这条规则（web security 的 formal methods 又会满额）。
  context_floor: 0.4
  evidence:
    title: 1.0            # 命中在标题里
    summary: 0.75         # 命中在摘要里
    body_strong: 0.5      # 正文里命中 2 个以上不同词，或同一个词 ≥3 次
    body_repeated: 0.3    # 正文里同一个词出现 2 次
    body_once: 0.15       # 正文里只出现 1 次
