# ----------------------------------------------------------------------------
# 6. 分档：总分 -> 档位。只有前两档会开 GitHub Issue、花 Gemini 额度。
#    A/B/C/D 只是内部排序用的键，面板和 Issue 上显示的是 name。
# ----------------------------------------------------------------------------
tiers:
  A:
    min: 62
    name: 对口            # 课题、机构、人都对上了
    github: tier:对口
  B:
    min: 38
    name: 值得细看        # 境外 robotics PhD 大多落这里
    github: tier:值得细看
  C:
    min: 22
    name: 擦边            # 面板里可见，不开 issue，不花 LLM
  D:
    min: 0
    name: 不相关          # 默认在面板里折叠

# ----------------------------------------------------------------------------
# 7. LLM 研判
# ----------------------------------------------------------------------------
llm:
  enabled: true
  model: gemini-3.5-flash     # 2-6 s/次；想更准可换 gemini-3.8-flash（50 s-5 min/次）
  max_jobs_per_run: 25        # 单次 scan 最多研判多少个新岗位，防止免费额度被打爆
  min_tier: B                 # 只研判 A/B
  body_chars: 9000            # 送进去的正文截断长度

# ----------------------------------------------------------------------------
# 8. GitHub Issue
# ----------------------------------------------------------------------------
issues:
  max_per_run: 30   # 首次 bootstrap 可能一次命中几十个，分批开，免得刷屏

# ----------------------------------------------------------------------------
# 9. 主题闸门
#    机构分 + 国家分最高能到 32，比大多数岗位的主题分还高。没有闸门的话，
#    Chalmers 的纺织复合材料 PhD 会排在 ETH 的 robot learning PhD 前面。
#    主题分够不到 topic_gate 时，机构/国家/加分信号按比例打折。
# ----------------------------------------------------------------------------
scoring:
  topic_gate: 14          # 主题分到这个数，上下文分才全额计入
  partial_factor: 0.5     # 主题分在 gate/2 ~ gate 之间，打五折
  off_topic_factor: 0.15  # 主题分低于 gate/2，基本只剩主题分本身
  ungated_labels:         # 这些信号太具体，不受闸门影响
    - named-supervisor
