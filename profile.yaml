# ----------------------------------------------------------------------------
# 4. 上下文标记：**一分不加**，只在面板上显示成标签、可以筛、可以搜。
#    学校、地区、导师、经费条件都在这儿。它们决定你投不投，不决定这条广告
#    和你的课题有多像——以前它们计分，结果 Chalmers 的 web security PhD
#    （本校 +18、瑞典 +10）压过了一半真正的 robotics 岗。
#
#    field: 在哪个字段里找（title / summary / body / employer / country /
#    text＝标题+摘要+正文）。severity: good 绿标，blocker 红标，note 灰标。
# ----------------------------------------------------------------------------
